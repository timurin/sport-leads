# Production stack (17.2.1) — API + Next + Postgres + Caddy.
# Local Postgres-only compose remains `compose.yaml`.
#
# Usage (on the VPS, after copying secrets):
#   cp .env.production.example .env.production   # edit secrets + domain
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
#
# Postgres is bound to host loopback only (SSH tunnel / Stage 0.5). Never 0.0.0.0:5432.
# Do not expose API / Next ports publicly; only Caddy :80/:443.
# Deploy automation: `.github/workflows/deploy-production.yml` (17.2.2).
# Canonical VPS workflow: `docs/ops/vps-canonical-0-5.md` (ADR-032).

name: sport-leads-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sport_network

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AUTH_BOOTSTRAP_LOGIN: ${AUTH_BOOTSTRAP_LOGIN:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_SESSION_MAX_HOURS: ${AUTH_SESSION_MAX_HOURS:-24}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      SPORT_LEADS_CORS_ORIGINS: ${SPORT_LEADS_CORS_ORIGINS:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://sport-lead.ru}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sport_network

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPORT_LEADS_API_URL: http://api:8000
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      - api
    networks:
      - sport_network

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPORT_LEADS_DOMAIN: ${SPORT_LEADS_DOMAIN:-sport-lead.ru}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - sport_network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  sport_network:
    driver: bridge
